name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name MainOrginizer main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MainOrginizer-Windows-x64
          path: dist/MainOrginizer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/MainOrginizer.exe
